[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-data-ai-platform"
version = "0.1.0"
description = "Plataforma de dados e IA sobre Microsoft Fabric"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "faker>=24.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pyspark>=3.5,<4",
]
dev = [
    "fabric-data-ai-platform[test]",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["platform_lib*", "infra*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = [
    "spark: testes de integração que exigem pyspark local",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "infra"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
